# The suite runs under the race detector on every push, against both store
# backends. The bus race shipped past a local script that piped test output
# through head; this exists so that class of miss cannot recur.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jetway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test (race, both backends)
        env:
          JETWAY_TEST_DSN: postgres://postgres:postgres@localhost:5432/jetway_test?sslmode=disable
        run: go test -race -count=1 ./...
